name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_install:
        description: '运行完整 Linux 安装、升级、回滚和卸载测试'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  basic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: |
          for script in install.sh run.sh scripts/*.sh tests/installer/run.sh; do bash -n "$script"; done
      - name: Check Python syntax and web manifest
        run: |
          python -m compileall -q app.py proxy.py scripts tests
          python -m json.tool static/manifest.webmanifest > /dev/null
      - name: Test log retention without external services
        run: python -m unittest discover -s tests -p 'test_log_retention.py' -v

  installer:
    needs: basic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_install }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test real apt and systemd installation in disposable Debian
        run: bash tests/installer/run.sh
